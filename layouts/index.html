<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <title>{{ .Title }}</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background-color: #0f172a;
      color: #e5e7eb;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
      color: #3b82f6;
    }

    h2 {
      margin-top: 40px;
      color: #93c5fd;
    }

    p {
      line-height: 1.7;
      font-size: 18px;
    }

    .content {
      margin-top: 30px;
    }

    a {
      color: #60a5fa;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    code {
      background: #1e293b;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>{{ .Title }}</h1>

    {{ with .Params.subtitle }}
      <p><strong>{{ . }}</strong></p>
    {{ end }}

    <div class="content">
      {{ .Content }}
    </div>

  </div>

</body>
</html>

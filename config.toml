baseURL = "https://cbhds-dbengine.github.io/CBhDS-Site/"
languageCode = "fr-fr"
title = "Portfolio Technique"
theme = "PaperMod"

[module]
  [[module.mounts]]
    source = "themes/PaperMod/layouts"
    target = "layouts"
  [[module.mounts]]
    source = "themes/PaperMod/assets"
    target = "assets"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "static"
    target = "static"
    
[params]
    # Le texte du footer (le symbole © et l'année sont souvent automatiques)
    footerText = "CBhDS — SQL Server Production Engineering"
    
    # Pour ton lien LinkedIn
    [[params.socialIcons]]
        name = "linkedin"
        url = "https://www.linkedin.com/in/chbrault-dba/"
